name: Deploy to GitHub Pages

# GitHub Pages publishes from a public repository on the Free plan (and from
# private repositories on Pro, Team and Enterprise). The job skips itself while
# the repository is private, and runs on the next push once it is public.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the live URL
        run: echo "Published at ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
